; Independent Windows build of upstream 9b1a6674248b2479d2265e9cff0f5da9e8ad7330.
; Match upstream CI: Arduino-ESP32 3.3.12 + NimBLE-Arduino 2.5.1.
;
; Board target is the user's ESP32-S3-WROOM-1 N16R8 on a DevKitC-1 style carrier:
; 16 MB quad flash + 8 MB octal PSRAM. The n16r8 board definition supplies
; qio_opi memory_type, opi psram and default_16MB.csv, so no overrides here.
[platformio]
core_dir = .pio-core
src_dir = hardware/hid_bridge

[env:devkitc1_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -include "$PROJECT_DIR/hardware/hid_bridge/nimble_cfg.h"
    -I"$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/libraries/FS/src"

; Diagnostic build: enables the firmware's own DEBUG_SERIAL logging, which prints the
; AirPlay handshake (GET /info, pair-setup, fp-setup, "mirror: SPS ... PPS",
; "mirror: H.265 stream not supported", "mirror: undecodable payload", command echoes).
; Needed to tell "no IDR arriving" apart from "stream format unsupported" on iOS 27.
; Note: with ARDUINO_USB_CDC_ON_BOOT=1 these logs go to the NATIVE USB port, not UART.
[env:devkitc1_n16r8_debug]
extends = env:devkitc1_n16r8
build_flags =
    ${env:devkitc1_n16r8.build_flags}
    -DDEBUG_SERIAL=1
